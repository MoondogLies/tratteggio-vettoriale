<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Stampa da giornale · Ricamo · SVG</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:#101014;color:#e8e8ee;font:15px/1.45 system-ui,sans-serif}.stage{display:flex;height:100dvh;width:100%;touch-action:none}.pane{flex:1 1 50%;position:relative;display:grid;place-items:center;background:#f2ecd8;overflow:hidden}.pane canvas,.pane svg{max-width:100%;max-height:100%;width:auto;height:auto;display:block}.zoomWrap{position:absolute;inset:0;display:grid;place-items:center;transform-origin:50% 50%;will-change:transform}.zoomBar{position:absolute;bottom:10px;right:10px;display:flex;gap:6px;z-index:5}.zoomBar button{background:rgba(15,15,20,.82);padding:6px 10px;font-size:13px;border-radius:8px}.tag{position:absolute;top:10px;left:10px;background:rgba(15,15,20,.72);color:#fff;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px;pointer-events:none}#toggleControls{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;background:#2f6fed;color:#fff;border:0;border-radius:999px;padding:12px 20px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45)}.controls{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(20,20,26,.96);backdrop-filter:blur(14px);border-top:1px solid #33333d;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .28s ease;max-height:78dvh;overflow:auto}.controls.open{transform:translateY(0)}.controls h2{margin:0 0 12px;font-size:16px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px;align-items:end}.ctrl{display:none}.ctrl.visible{display:block}label{display:block;font-size:11px;color:#a8a8b4;margin-bottom:5px}label.check{display:flex;gap:8px;align-items:center;font-size:13px;color:#e8e8ee;margin:0 0 6px}input[type=range]{width:100%}select,input[type=number],input[type=file]{width:100%;background:#0c0c10;color:#e8e8ee;border:1px solid #33333d;border-radius:8px;padding:8px}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}button{background:#2f6fed;border:0;color:#fff;padding:10px 14px;border-radius:9px;font-weight:600;cursor:pointer}button.secondary{background:#33333d}button:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:10px;color:#9d9daa;font-size:12px}.hint{margin:2px 0 12px;color:#9d9daa;font-size:12px}#svgBox{width:100%;height:100%;display:grid;place-items:center;min-width:0;min-height:0}#svgBox svg{max-width:100%;max-height:100%}#svgBox.checker svg{background:repeating-conic-gradient(#d9d9de 0 25%,#fff 0 50%) 0 0/16px 16px}select:disabled,input:disabled{opacity:.45}textarea{width:100%;height:110px;margin-top:10px;background:#0c0c10;color:#d8d8e2;border:1px solid #2b2b34;border-radius:8px;font:11px/1.4 ui-monospace,monospace;padding:8px;resize:vertical}@media(max-width:640px){.stage{flex-direction:row}.pane{min-width:0}.tag{font-size:9px;padding:3px 6px}}
</style></head><body>
<div class="stage"><div class="pane"><div class="zoomWrap"><canvas id="preview"></canvas></div><div class="zoomBar"><button type="button" data-zoom="out">−</button><button type="button" data-zoom="in">+</button><button type="button" data-zoom="fit">Adatta</button></div><span class="tag">Originale</span></div><div class="pane"><div class="zoomWrap"><div id="svgBox"></div></div><div class="zoomBar"><button type="button" data-zoom="out">−</button><button type="button" data-zoom="in">+</button><button type="button" data-zoom="fit">Adatta</button></div><span class="tag">Stampa</span></div></div><button id="toggleControls">Controlli</button>
<div class="controls" id="controlsPanel"><h2>Impostazioni stampa</h2><p class="hint" id="modeHint"></p><div class="row">
<div class="ctrl visible" data-modes="cmyk mono comic embroidery vector cutout"><label for="file">Immagine</label><input type="file" id="file" accept="image/*"></div>
<div class="ctrl visible" data-modes="cmyk mono comic embroidery vector cutout"><label for="style">Stile</label><select id="style"><option value="cmyk">CMYK fuori registro</option><option value="mono" selected>Halftone bianco/nero · giornale</option><option value="comic">Stampa fumetto · Ben-Day</option><option value="embroidery">Ricamo · fili</option><option value="vector">Vettoriale · pieni</option><option value="cutout">Rimuovi sfondo</option></select></div>
<div class="ctrl" data-modes="cmyk mono comic"><label for="spacing">Passo retino: <span id="spacingValue"></span> px</label><input type="range" id="spacing" min="3" max="14" step="0.5"></div>
<div class="ctrl" data-modes="cmyk mono comic"><label for="blur">Sfocatura: <span id="blurValue"></span></label><input type="range" id="blur" min="0" max="6" step="0.5"></div>
<div class="ctrl" data-modes="cmyk mono comic"><label for="dotGain">Ingrasso punto (mezzitoni): <span id="dotGainValue"></span>%</label><input type="range" id="dotGain" min="0" max="40"></div>
<div class="ctrl" data-modes="cmyk mono comic"><label for="contrast">Contrasto: <span id="contrastValue"></span></label><input type="range" id="contrast" min="-50" max="150"></div>
<div class="ctrl" data-modes="cmyk mono"><label for="gamma">Gamma: <span id="gammaValue"></span></label><input type="range" id="gamma" min="0.5" max="3" step="0.05"></div>
<div class="ctrl" data-modes="cmyk mono comic"><label for="inkVar">Inchiostrazione irregolare: <span id="inkVarValue"></span>%</label><input type="range" id="inkVar" min="0" max="50"></div>
<div class="ctrl" data-modes="cmyk"><label for="gcr">Sostituzione nero (GCR): <span id="gcrValue"></span>%</label><input type="range" id="gcr" min="0" max="100"></div>
<div class="ctrl" data-modes="cmyk comic"><label for="offset">Fuori registro: <span id="offsetValue"></span> px</label><input type="range" id="offset" min="0" max="6" step="0.1"></div>
<div class="ctrl" data-modes="cmyk comic"><label for="jitter">Rumore registro: <span id="jitterValue"></span> px</label><input type="range" id="jitter" min="0" max="3" step="0.1"></div>
<div class="ctrl" data-modes="comic"><label for="lineThreshold">Soglia china nera: <span id="lineThresholdValue"></span>%</label><input type="range" id="lineThreshold" min="0" max="60"></div>
<div class="ctrl" data-modes="comic"><label for="edgeStrength">Contorni a china: <span id="edgeStrengthValue"></span>%</label><input type="range" id="edgeStrength" min="0" max="100"></div>
<div class="ctrl" data-modes="cmyk mono comic"><label class="check"><input type="checkbox" id="texture"> Carta e inchiostro realistici</label></div>
<div class="ctrl" data-modes="embroidery"><label for="threadColors">Colori filo: <span id="threadColorsValue"></span></label><input type="range" id="threadColors" min="2" max="16"></div>
<div class="ctrl" data-modes="embroidery"><label for="stitchLength">Lunghezza punto: <span id="stitchLengthValue"></span> px</label><input type="range" id="stitchLength" min="4" max="40"></div>
<div class="ctrl" data-modes="embroidery"><label for="stitchSpacing">Distanza tra le file: <span id="stitchSpacingValue"></span> px</label><input type="range" id="stitchSpacing" min="1.5" max="12" step="0.5"></div>
<div class="ctrl" data-modes="embroidery"><label for="stitchWidth">Spessore filo: <span id="stitchWidthValue"></span> px</label><input type="range" id="stitchWidth" min="1" max="6" step="0.5"></div>
<div class="ctrl" data-modes="embroidery"><label for="lightAngle">Direzione luce: <span id="lightAngleValue"></span>°</label><input type="range" id="lightAngle" min="0" max="359"></div>
<div class="ctrl" data-modes="embroidery"><label class="check"><input type="checkbox" id="skipBackground"> Lascia il tessuto sullo sfondo</label></div>
<div class="ctrl" data-modes="vector"><label for="vectorColors">Colori: <span id="vectorColorsValue"></span></label><input type="range" id="vectorColors" min="2" max="24"></div>
<div class="ctrl" data-modes="vector"><label class="check"><input type="checkbox" id="vectorBW"> Bianco e nero · sole ombre</label></div>
<div class="ctrl" data-modes="vector"><label for="vectorThreshold">Soglia nero: <span id="vectorThresholdValue"></span>%</label><input type="range" id="vectorThreshold" min="5" max="95"></div>
<div class="ctrl" data-modes="vector"><label for="vectorSimplify">Semplificazione contorno: <span id="vectorSimplifyValue"></span> px</label><input type="range" id="vectorSimplify" min="0" max="5" step="0.5"></div>
<div class="ctrl" data-modes="vector"><label for="vectorDespeckle">Elimina macchie sotto: <span id="vectorDespeckleValue"></span> px²</label><input type="range" id="vectorDespeckle" min="0" max="200"></div>
<div class="ctrl" data-modes="vector"><label class="check"><input type="checkbox" id="vectorSmooth"> Curve morbide (Bézier)</label></div>
<div class="ctrl visible" data-modes="cutout"><label for="bgMethod">Metodo</label><select id="bgMethod"><option value="auto">Automatico</option><option value="ai">IA · qualsiasi soggetto (RMBG-1.4)</option><option value="color">Sfondo a tinta unita (senza IA)</option></select></div>
<div class="ctrl" data-modes="cutout"><label for="bgTolerance">Tolleranza colore sfondo: <span id="bgToleranceValue"></span></label><input type="range" id="bgTolerance" min="2" max="60"></div>
<div class="ctrl" data-modes="cutout"><label class="check"><input type="checkbox" id="bgHoles"> Togli lo sfondo anche nei buchi interni</label></div>
<div class="ctrl" data-modes="cutout"><label class="check"><input type="checkbox" id="cutTrace"> Converti in tracciati SVG (ideale per i loghi)</label></div>
<div class="ctrl" data-modes="cutout"><label for="cutColors">Colori del tracciato: <span id="cutColorsValue"></span></label><input type="range" id="cutColors" min="0" max="32"></div>
<div class="ctrl" data-modes="cutout"><label class="check"><input type="checkbox" id="cutSilhouette"> Sagoma in un solo colore</label></div>
<div class="ctrl" data-modes="cutout"><label for="maskThreshold">Soglia bordo soggetto: <span id="maskThresholdValue"></span>%</label><input type="range" id="maskThreshold" min="5" max="95"></div>
<div class="ctrl" data-modes="cutout"><label class="check"><input type="checkbox" id="cropToSubject"> Ritaglia attorno al soggetto</label></div>
<div class="ctrl visible" data-modes="cmyk mono comic embroidery vector cutout"><button id="convert">Converti</button></div></div>
<div class="actions"><button id="download" class="secondary" disabled>Scarica SVG</button><button id="copy" class="secondary" disabled>Copia path SVG</button></div><div class="status" id="status">Carica un’immagine per iniziare.</div><textarea id="output" readonly placeholder="Qui compariranno i path SVG…"></textarea></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const MAX_STITCHES=60000;

/* ---------- Impostazioni storiche predefinite per ogni modalità ---------- */
const PRESETS={
  // Quotidiano anni '30–'70: retino grossolano (~65–85 lpi) a 45°, carta da giornale, forte ingrasso.
  mono:{spacing:5,blur:1,dotGain:22,contrast:10,gamma:1.1,inkVar:15,texture:true},
  // Quadricromia offset: angoli 15/75/0/45, GCR, limite inchiostro, inchiostri ISO.
  cmyk:{spacing:4,blur:.5,dotGain:14,contrast:10,gamma:1,inkVar:8,gcr:60,offset:1.2,jitter:.5,texture:true},
  // Fumetto americano 1940–'70: china al tratto + retini Ben-Day a tinte fisse 0/25/50/100%.
  comic:{spacing:5,blur:2,dotGain:15,contrast:15,inkVar:10,offset:1.5,jitter:.8,lineThreshold:22,edgeStrength:70,texture:true},
  // Ricamo a macchina: riempimento tatami, colonne satin, palette di fili limitata.
  embroidery:{threadColors:8,stitchLength:16,stitchSpacing:3,stitchWidth:3,lightAngle:315,skipBackground:false},
  vector:{vectorColors:8,vectorBW:false,vectorThreshold:50,vectorSimplify:1,vectorDespeckle:12,vectorSmooth:true},
  cutout:{bgMethod:'auto',bgTolerance:18,bgHoles:false,cutTrace:false,cutColors:0,cutSilhouette:false,maskThreshold:50,cropToSubject:true}
};
const HINTS={
  mono:'Retino a 45° su carta da giornale: punti tondi che si fondono nei mezzitoni, alte luci che saltano, ombre che si impastano.',
  cmyk:'Quadricromia: retini C 15°, M 75°, Y 0°, K 45°, nero GCR, limite inchiostro 300%, lastre fuori registro.',
  comic:'Fumetto d’epoca: nero al tratto senza retino, colori da 64 tinte piatte (0/25/50/100% per C, M, Y) in punti Ben-Day.',
  embroidery:'Ricamo a macchina: aree di colore filo riempite a punto tatami, parti strette a punto satin.',
  vector:'Ricalco vettoriale a campiture piatte (posterizzazione).',
  cutout:'Scontorna il soggetto ed esporta un SVG con sfondo trasparente. Con «Automatico» i loghi su fondo uniforme usano il metodo senza IA, più netto; attiva «Converti in tracciati» per avere path SVG. Il modello IA RMBG-1.4 (BRIA AI, gratuito solo per uso non commerciale) gira nel browser: la prima volta scarica circa 44 MB, poi resta in cache.'
};
const modeSettings={};
let currentMode=null;

const fileInput=$('file'),styleInput=$('style'),preview=$('preview'),svgBox=$('svgBox'),output=$('output'),statusEl=$('status'),convertButton=$('convert'),downloadButton=$('download'),copyButton=$('copy'),controlsPanel=$('controlsPanel'),toggleControls=$('toggleControls'),stage=document.querySelector('.stage');
let image=null,svg='',zoom=1,panX=0,panY=0,dragging=false,lastPX=0,lastPY=0;

/* ---------- Zoom e pan sincronizzati ---------- */
function applyView(){document.querySelectorAll('.zoomWrap').forEach(el=>{el.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`})}
function fitView(){zoom=1;panX=0;panY=0;applyView()}
function zoomAt(factor,cx,cy){const next=Math.max(.2,Math.min(8,zoom*factor)),k=1-next/zoom;panX+=cx*k;panY+=cy*k;zoom=next;applyView()}
stage.addEventListener('wheel',e=>{if(!image)return;const pane=e.target.closest('.pane');if(!pane)return;e.preventDefault();const r=pane.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2)},{passive:false});
stage.addEventListener('pointerdown',e=>{if(!image||e.target.closest('button'))return;dragging=true;lastPX=e.clientX;lastPY=e.clientY;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!dragging)return;panX+=e.clientX-lastPX;panY+=e.clientY-lastPY;lastPX=e.clientX;lastPY=e.clientY;applyView()});
stage.addEventListener('pointerup',()=>dragging=false);stage.addEventListener('pointercancel',()=>dragging=false);
document.querySelectorAll('[data-zoom]').forEach(btn=>btn.addEventListener('click',()=>{const pane=btn.closest('.pane'),r=pane.getBoundingClientRect();if(btn.dataset.zoom==='in')zoomAt(1.25,r.width/2,r.height/2);else if(btn.dataset.zoom==='out')zoomAt(1/1.25,r.width/2,r.height/2);else fitView()}));
toggleControls.onclick=()=>{controlsPanel.classList.toggle('open');toggleControls.textContent=controlsPanel.classList.contains('open')?'Chiudi':'Controlli'};

/* ---------- Controlli ---------- */
const paramInputs=()=>[...document.querySelectorAll('.controls input[type=range],.controls input[type=checkbox],.controls select:not(#style)')];
function readParams(){const p={};paramInputs().forEach(el=>p[el.id]=el.type==='checkbox'?el.checked:el.tagName==='SELECT'?el.value:+el.value);return p}
function refreshLabels(){document.querySelectorAll('.controls input[type=range]').forEach(el=>{const s=$(el.id+'Value');if(s)s.textContent=el.id==='cutColors'&&+el.value===0?'Auto':el.value})}
function updateBWControls(){$('vectorColors').disabled=$('vectorBW').checked;$('vectorThreshold').disabled=!$('vectorBW').checked;const color=$('bgMethod').value!=='ai',trace=$('cutTrace').checked;$('bgTolerance').disabled=!color;$('bgHoles').disabled=!color;$('cutSilhouette').disabled=!trace;$('cutColors').disabled=!trace||$('cutSilhouette').checked}
function applySettings(obj){for(const[k,v]of Object.entries(obj)){const el=$(k);if(!el)continue;if(el.type==='checkbox')el.checked=!!v;else el.value=v}refreshLabels();updateBWControls()}
function switchMode(){
  if(currentMode){const cur=readParams(),saved={};Object.keys(PRESETS[currentMode]).forEach(k=>saved[k]=cur[k]);modeSettings[currentMode]=saved}
  currentMode=styleInput.value;
  applySettings(modeSettings[currentMode]||PRESETS[currentMode]);
  document.querySelectorAll('.ctrl').forEach(el=>el.classList.toggle('visible',(el.dataset.modes||'').split(' ').includes(currentMode)));
  $('modeHint').textContent=HINTS[currentMode]||'';
}
paramInputs().forEach(el=>el.addEventListener('input',refreshLabels));
['vectorBW','bgMethod','cutTrace','cutSilhouette'].forEach(id=>$(id).addEventListener('change',updateBWControls));
styleInput.onchange=switchMode;
switchMode();

fileInput.onchange=()=>{const file=fileInput.files[0];if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{image=img;drawPreview(img);fitView();statusEl.textContent='Immagine caricata. Premi Converti.';URL.revokeObjectURL(url)};img.onerror=()=>{statusEl.textContent='File immagine non leggibile.';URL.revokeObjectURL(url)};img.src=url};
function drawPreview(img){const scale=Math.min(1,1100/Math.max(img.width,img.height));preview.width=Math.max(1,Math.round(img.width*scale));preview.height=Math.max(1,Math.round(img.height*scale));preview.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0,preview.width,preview.height)}

convertButton.onclick=()=>{
  if(!image){statusEl.textContent='Carica prima un’immagine.';return}
  statusEl.textContent='Elaborazione…';convertButton.disabled=true;
  setTimeout(async()=>{try{
    const style=styleInput.value,r=style==='cutout'?await removeBackground(image,readParams(),msg=>statusEl.textContent=msg):makePrint(image,style,readParams());
    svgBox.innerHTML=r.svg;svgBox.classList.toggle('checker',style==='cutout');fitView();output.value=r.pathData.length?r.pathData.join('\n'):'(foto incorporata come immagine: nessun path vettoriale)';svg=r.svg;
    downloadButton.disabled=false;copyButton.disabled=!r.pathData.length;
    statusEl.textContent=`${r.count} elementi vettoriali generati.`+(r.note?' '+r.note:'');
  }catch(e){console.error(e);statusEl.textContent='Errore: '+e.message}finally{convertButton.disabled=false}},30);
};
downloadButton.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download=({cmyk:'stampa-cmyk.svg',mono:'halftone-giornale.svg',comic:'stampa-fumetto.svg',embroidery:'ricamo-fili.svg',vector:'tracciato-vettoriale.svg',cutout:'senza-sfondo.svg'})[styleInput.value]||'stampa.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
copyButton.onclick=async()=>{try{if(!navigator.clipboard)throw new Error('API appunti non disponibile');await navigator.clipboard.writeText(output.value);statusEl.textContent='Path SVG copiati negli appunti.'}catch(e){output.focus();output.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}statusEl.textContent=ok?'Path SVG copiati negli appunti.':'Copia non riuscita: testo selezionato, copialo con Ctrl/Cmd+C.'}};

/* ---------- Pipeline ---------- */
function makePrint(img,style,p){
  const scale=Math.min(1,1100/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
  const rgb=ctx.getImageData(0,0,w,h).data;
  switch(style){
    case 'mono':return newspaperBW(rgb,w,h,p);
    case 'cmyk':return processCMYK(rgb,w,h,p);
    case 'comic':return comicBook(rgb,w,h,p);
    case 'embroidery':return embroidery(rgb,w,h,p);
    case 'vector':return vectorize(rgb,w,h,p);
  }
  throw new Error('Stile sconosciuto');
}

/* Halftone da giornale: un solo inchiostro nero, retino a 45°, carta da giornale ingiallita. */
function newspaperBW(rgb,w,h,p){
  const s=p.spacing,flat=flattenWhite(rgb);
  let ink=new Float32Array(w*h);
  for(let i=0,j=0;j<ink.length;i+=4,j++)ink[j]=1-luma(flat[i],flat[i+1],flat[i+2])/255;
  if(p.blur>0)ink=blurBox(ink,w,h,p.blur);
  ink=contrastAdjust(ink,p.contrast);
  const res=halftoneScreen({w,h,spacing:s,angle:45,spread:gainSpread(p.dotGain/100,s),minDot:.05,inkVar:p.inkVar/100,seed:11,compensate:.85,
    sample:(x,y)=>Math.pow(clamp01(sampleBilinear(ink,w,h,x,y)),p.gamma)});
  return{svg:printSvg({w,h,paper:'#e7ddc4',texture:p.texture,rough:s*.3,freq:1.2/s,layers:[{color:'#1e1c1a',d:res.d,opacity:.93}]}),pathData:[res.d],count:res.count};
}

/* Quadricromia offset con nero GCR, limite di copertura e angoli di retino standard. */
function processCMYK(rgb,w,h,p){
  const s=p.spacing,n=w*h,flat=flattenWhite(rgb),gcr=p.gcr/100,TAC=3,rng=mulberry32(21);
  const C=new Float32Array(n),M=new Float32Array(n),Y=new Float32Array(n),K=new Float32Array(n);
  for(let i=0,j=0;j<n;i+=4,j++){
    const r=flat[i]/255,g=flat[i+1]/255,b=flat[i+2]/255,k0=1-Math.max(r,g,b),k=gcr*k0+(1-gcr)*k0*k0*k0,d=1-k; // curva di generazione del nero: K pieno sui neri
    let c=d>.001?clamp01((1-r-k)/d):0,m=d>.001?clamp01((1-g-k)/d):0,y=d>.001?clamp01((1-b-k)/d):0;
    const sum=c+m+y+k;if(sum>TAC){const f=(TAC-k)/(c+m+y);c*=f;m*=f;y*=f}
    C[j]=c;M[j]=m;Y[j]=y;K[j]=k;
  }
  const o=p.offset,plates=[
    {f:Y,angle:0,color:'#ffe600',off:[-o*.8,-o*.8]},
    {f:M,angle:75,color:'#e4007c',off:[0,o]},
    {f:C,angle:15,color:'#009fe3',off:[o,0]},
    {f:K,angle:45,color:'#1d1d1b',off:[0,0],ref:true}];
  const spread=gainSpread(p.dotGain/100,s),layers=[],pathData=[];let count=0;
  plates.forEach((pl,idx)=>{
    let f=pl.f;if(p.blur>0)f=blurBox(f,w,h,p.blur);f=contrastAdjust(f,p.contrast);
    const res=halftoneScreen({w,h,spacing:s,angle:pl.angle,spread,minDot:.02,inkVar:p.inkVar/100,seed:31+idx,compensate:.8,sample:(x,y)=>Math.pow(clamp01(sampleBilinear(f,w,h,x,y)),p.gamma)});
    count+=res.count;pathData.push(res.d);
    layers.push({color:pl.color,d:res.d,transform:pl.ref?'':plateTransform(w,h,pl.off[0],pl.off[1],p.jitter,rng),blend:true});
  });
