<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:#101014;color:#e8e8ee;font:15px/1.45 system-ui,sans-serif}.stage{display:flex;height:100dvh;width:100%}.pane{flex:1 1 50%;position:relative;display:grid;place-items:center;background:#f2ecd8;overflow:hidden}.pane canvas,.pane svg{max-width:100%;max-height:100%;width:auto;height:auto;display:block}.zoomWrap{position:absolute;inset:0;display:grid;place-items:center;transform-origin:50% 50%;will-change:transform}.zoomBar{position:absolute;bottom:10px;right:10px;display:flex;gap:6px;z-index:5}.zoomBar button{background:rgba(15,15,20,.82);padding:6px 10px;font-size:13px;border-radius:8px}.tag{position:absolute;top:10px;left:10px;background:rgba(15,15,20,.72);color:#fff;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:6px;pointer-events:none}#toggleControls{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;background:#2f6fed;color:#fff;border:0;border-radius:999px;padding:12px 20px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45)}.controls{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(20,20,26,.96);backdrop-filter:blur(14px);border-top:1px solid #33333d;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .28s ease;max-height:78dvh;overflow:auto}.controls.open{transform:translateY(0)}.controls h2{margin:0 0 12px;font-size:16px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px;align-items:end}.ctrl{display:none}.ctrl.visible{display:block}label{display:block;font-size:11px;color:#a8a8b4;margin-bottom:5px}input[type=range]{width:100%}select,input[type=number],input[type=file]{width:100%;background:#0c0c10;color:#e8e8ee;border:1px solid #33333d;border-radius:8px;padding:8px}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}button{backgrou </style></head><body>
<div class="stage"><div class="pane"><div class="zoomWrap"><canvas id="preview"></canvas></div><div class="zoomBar"><button type="button" data-zoom="out">−</button><button type="button" data-zoom="in">+</button><button type="button" data-zoom="fit">Adatta</button></div><span class="tag">Originale</span></div><div class="pane"><div class="zoomWrap"><div id="svgBox"></div></div><div class="zoomBar"><button type="button" data-zoom="out">−</button><button type="button" data-zoom="in">+</button><button type="button" data-zoom="fit">Adatta</button></div><span class="tag">Stampa</span></div></div><button id="toggleControls">Controlli</button>
<div class="controls" id="controlsPanel"><h2>Impostazioni stampa</h2><div class="row">

<script>
const $=id=>document.getElementById(id);
const MAX_STITCH_SEEDS=80000;
const ids=['spacing','blur','dotGain','contrast','gamma','inkVar','offset','jitter','stitchLength','stitchSpacing','stitchWidth','lightAngle','colorCompression','vectorColors','vectorSimplify'];
const fileInput=$('file'),styleInput=$('style'),preview=$('preview'),svgBox=$('svgBox'),output=$('output'),statusEl=$('status'),convertButton=$('convert'),downloadButton=$('download'),copyButton=$('copy'),controlsPanel=$('controlsPanel'),toggleControls=$('toggleControls'),stage=document.querySelector('.stage');
let image=null,svg='',zoom=1,panX=0,panY=0,dragging=false,lastPX=0,lastPY=0;
function applyView(){document.querySelectorAll('.zoomWrap').forEach(el=>{el.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`})}
function fitView(){zoom=1;panX=0;panY=0;applyView()}
function zoomAt(factor,cx,cy){const next=Math.max(.2,Math.min(8,zoom*factor)),k=1-next/zoom;panX+=cx*k;panY+=cy*k;zoom=next;applyView()}
stage.addEventListener('wheel',e=>{if(!image)return;const pane=e.target.closest('.pane');if(!pane)return;e.preventDefault();const r=pane.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2)},{passive:false});
stage.addEventListener('pointerdown',e=>{if(!image||e.target.closest('button'))return;dragging=true;lastPX=e.clientX;lastPY=e.clientY;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!dragging)return;panX+=e.clientX-lastPX;panY+=e.clientY-lastPY;lastPX=e.clientX;lastPY=e.clientY;applyView()});
stage.addEventListener('pointerup',()=>dragging=false);stage.addEventListener('pointercancel',()=>dragging=false);
document.querySelectorAll('[data-zoom]').forEach(btn=>btn.addEventListener('click',()=>{const pane=btn.closest('.pane'),r=pane.getBoundingClientRect();if(btn.dataset.zoom==='in')zoomAt(1.25,r.width/2,r.height/2);else if(btn.dataset.zoom==='out')zoomAt(1/1.25,r.width/2,r.height/2);else fitView()}));
toggleControls.onclick=()=>{controlsPanel.classList.toggle('open');toggleControls.textContent=controlsPanel.classList.contains('open')?'Chiudi':'Controlli'};
function updateControlsVisibility(){document.querySelectorAll('.ctrl').forEach(el=>el.classList.toggle('visible',(el.dataset.modes||'').split(' ').includes(styleInput.value)))}
function refreshLabels(){ids.forEach(id=>$(id+'Value').textContent=$(id).value)}
function updateBWControls(){$('vectorColors').disabled=$('vectorBW').checked;$('vectorThreshold').disabled=!$('vectorBW').checked}
$('vectorBW').onchange=updateBWControls;$('vectorThreshold').oninput=()=>{$('vectorThresholdValue').textContent=$('vectorThreshold').value};updateBWControls();
refreshLabels();updateControlsVisibility();ids.forEach(id=>$(id).oninput=refreshLabels);styleInput.onchange=updateControlsVisibility;
fileInput.onchange=()=>{const file=fileInput.files[0];if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{image=img;drawPreview(img);fitView();statusEl.textContent='Immagine caricata. Premi Converti.';URL.revokeObjectURL(url)};img.onerror=()=>{statusEl.textContent='File immagine non leggibile.';URL.revokeObjectURL(url)};img.src=url};
function drawPreview(img){const scale=Math.min(1,1100/Math.max(img.width,img.height));preview.width=Math.max(1,Math.round(img.width*scale));preview.height=Math.max(1,Math.round(img.height*scale));preview.style.width='auto';preview.style.height='auto';preview.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0,preview.width,preview.height)}
convertButton.onclick=()=>{if(!image){statusEl.textContent='Carica prima un’immagine.';return}statusEl.textContent='Generazione separazioni…';convertButton.disabled=true;setTimeout(()=>{try{const v=ids.map(id=>+$(id).value);v[2]/=100;v[5]/=100;v[12]/=100;const r=makePrint(image,styleInput.value,...v);svgBox.innerHTML=r.svg;fitView();output.value=r.pathData.join('\n');svg=r.svg;downloadButton.disabled=false;copyButton.disabled=false;statusEl.textContent=`${r.count} elementi vettoriali generati.`+(r.note?' '+r.note:'')}catch(e){console.error(e);statusEl.textContent='Errore: '+e.message}finally{convertButton.disabled=false}},30)};
downloadButton.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download=({cmyk:'stampa-cmyk.svg',mono:'halftone-bianco-nero.svg',comic:'stampa-fumetto.svg',embroidery:'ricamo-fili.svg',vector:'tracciato-vettoriale.svg'})[styleInput.value]||'stampa.svg';a.click();URL.revokeObjectURL(a.href)};
copyButton.onclick=async()=>{try{if(!navigator.clipboard)throw new Error('API appunti non disponibile');await navigator.clipboard.writeText(output.value);statusEl.textContent='Path SVG copiati negli appunti.'}catch(e){output.focus();output.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}statusEl.textContent=ok?'Path SVG copiati negli appunti.':'Copia non riuscita: testo selezionato, copialo con Ctrl/Cmd+C.'}};
function makePrint(img,style,spacing,blur,dotGain,contrast,gamma,inkVariability,offset,jitter,stitchLength,stitchSpacing,stitchWidth,lightAngle,colorCompression,vectorColors,vectorSimplify){
const scale=Math.min(1,1100/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);const rgb=ctx.getImageData(0,0,w,h).data;
if(style==='embroidery')return embroideryStitches(rgb,w,h,stitchLength,stitchSpacing,stitchWidth,lightAngle,colorCompression);
if(style==='vector')return vectorizeFilled(rgb,w,h,vectorColors,vectorSimplify,$('vectorBW').checked,+$('vectorThreshold').value/100);
const channels=[],perfectRegistration=offset===0&&jitter===0;
if(style==='mono'){let gray=invert01(normalize01(grayscale(rgb,w,h)));if(blur>0)gray=blurBox(gray,w,h,blur);channels.push({name:'K',color:'#1a1a1a',angle:45,dx:0,dy:0,field:contrastAdjust(gray,contrast)})}else{const cmyk=rgbToCmyk(rgb,w,h),angles={C:15,M:75,Y:0,K:45},offsets={C:[offset,0],M:[0,offset],Y:[-offset*.8,-offset*.8],K:[0,0]},colors={C:'#00AEEF',M:'#EC008C',Y:'#FFDE17',K:'#1a1a1a'};for(const key of ['C','M','Y','K']){let field=cmyk[key];if(blur>0)field=blurBox(field,w,h,blur);field=contrastAdjust(field,contrast);let angle=perfectRegistration?45:angles[key],dx=perfectRegistration?0:offsets[key][0],dy=perfectRegistration?0:offsets[key][1];if(jitter>0){dx+=(Math.random()-.5)*2*jitter;dy+=(Math.random()-.5)*2*jitter}channels.push({name:key,color:colors[key],angle,dx,dy,field})}}
const groups=channels.map(ch=>({color:ch.color,paths:halftone(ch.field,w,h,spacing,ch.angle,gamma,ch.dx,ch.dy,inkVariability,dotGain)}));const markup=groups.filter(g=>g.paths.length).map(g=>`<path style="mix-blend-mode:multiply" fill="${g.color}" d="${g.paths.join(' ')}"/>`).join('\n');return{svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="#f2ecd8"/>${markup}</svg>`,pathData:groups.filter(g=>g.paths.length).map(g=>g.paths.join(' ')),count:groups.reduce((n,g)=>n+g.paths.length,0)};
}
function vectorizeFilled(rgb,w,h,colorCount,simplifyTol,bw=false,threshold=.5){
const palette=bw?[[0,0,0]]:buildPalette(rgb,w,h,Math.max(0,(colorCount-2)/30));if(!palette.length)palette.push([128,128,128]);const labels=new Int16Array(w*h);
for(let i=0,p=0;i<labels.length;i++,p+=4){const r=rgb[p],g=rgb[p+1],b=rgb[p+2],alpha=rgb[p+3]/255;if(bw){const luminance=(.299*r+.587*g+.114*b)*alpha+255*(1-alpha);labels[i]=alpha>0&&luminance<threshold*255?0:-1;continue}if(alpha===0||(r>=232&&g>=232&&b>=232)){labels[i]=-1;continue}let best=0,bd=Infinity;for(let j=0;j<palette.length;j++){const dr=r-palette[j][0],dg=g-palette[j][1],db=b-palette[j][2],d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;best=j}}labels[i]=best}
const segs=palette.map(()=>[]),labelAt=(x,y)=>x<0||y<0||x>=w||y>=h?-1:labels[y*w+x],addSeg=(k,a,b)=>segs[k].push([a[0],a[1],b[0],b[1]]);
for(let y=-1;y<h;y++)for(let x=-1;x<w;x++){const la=labelAt(x,y),lb=labelAt(x+1,y),lc=labelAt(x+1,y+1),ld=labelAt(x,y+1);for(const k of new Set([la,lb,lc,ld].filter(v=>v>=0))){const code=(la===k?1:0)|(lb===k?2:0)|(lc===k?4:0)|(ld===k?8:0);if(code===0||code===15)continue;const T=[x+.5,y],R=[x+1,y+.5],B=[x+.5,y+1],L=[x,y+.5];switch(code){case 1:addSeg(k,L,T);break;case 2:addSeg(k,T,R);break;case 3:addSeg(k,L,R);break;case 4:addSeg(k,R,B);break;case 5:addSeg(k,R,T);addSeg(k,L,B);break;case 6:addSeg(k,T,B);break;case 7:addSeg(k,L,B);break;case 8:addSeg(k,B,L);break;case 9:addSeg(k,B,T);break;case 10:addSeg(k,T,L);addSeg(k,B,R);break;case 11:addSeg(k,B,R);break;case 12:addSeg(k,R,L);break;case 13:addSeg(k,R,T);break;case 14:addSeg(k,T,L);break}}}
const paths=[];let count=0;palette.forEach((color,k)=>{let d='';chainSegments(segs[k]).forEach(loop=>{if(loop.length<3)return;const pts=simplifyClosedPolygon(loop,Math.max(0,simplifyTol));if(pts.length>1&&pts[0][0]===pts[pts.length-1][0]&&pts[0][1]===pts[pts.length-1][1])pts.pop();if(pts.length<3)return;d+=`M ${r2(pts[0][0])} ${r2(pts[0][1])}`;for(let i=1;i<pts.length;i++)d+=` L ${r2(pts[i][0])} ${r2(pts[i][1])}`;d+=' Z ';count++});if(d)paths.push({color:`rgb(${Math.round(color[0])},${Math.round(color[1])},${Math.round(color[2])})`,d})});
const markup=paths.map(p=>`<path d="${p.d}" fill="${p.color}" fill-rule="evenodd"/>`).join('\n');return{svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${markup}</svg>`,pathData:paths.map(p=>p.d),count};
}
function chainSegments(segs){const map=new Map();segs.forEach((s,i)=>{const key=s[0]+','+s[1];if(!map.has(key))map.set(key,[]);map.get(key).push(i)});const used=new Uint8Array(segs.length),loops=[];for(let i=0;i<segs.length;i++){if(used[i])continue;const loop=[];let cur=i;while(cur!==-1){used[cur]=1;loop.push([segs[cur][0],segs[cur][1]]);const candidates=map.get(segs[cur][2]+','+segs[cur][3])||[];let next=-1;for(const ci of candidates)if(!used[ci]){next=ci;break}if(next===-1)break;cur=next}if(loop.length>2)loops.push(loop)}return loops}
function simplifyClosedPolygon(pts,tol){if(tol<=0||pts.length<5)return pts.concat([pts[0]]);let far=1,maxD=-1;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[0][0],pts[i][1]-pts[0][1]);if(d>maxD){maxD=d;far=i}}const a=simplifyPolyline(pts.slice(0,far+1),tol),b=simplifyPolyline(pts.slice(far).concat([pts[0]]),tol);return a.slice(0,-1).concat(b)}
function simplifyPolyline(pts,tol){if(tol<=0||pts.length<3)return pts;const keep=new Uint8Array(pts.length);keep[0]=keep[pts.length-1]=1;const stack=[[0,pts.length-1]];while(stack.length){const [a,b]=stack.pop();if(b-a<2)continue;const [x1,y1]=pts[a],[x2,y2]=pts[b],dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;let maxD=-1,idx=-1;for(let i=a+1;i<b;i++){const d=Math.abs(dy*(pts[i][0]-x1)-dx*(pts[i][1]-y1))/len;if(d>maxD){maxD=d;idx=i}}if(maxD>tol){keep[idx]=1;stack.push([a,idx],[idx,b])}}return pts.filter((_,i)=>keep[i])}
function buildPalette(rgb,w,h,strength){const samples=[],stride=Math.max(1,Math.round(Math.sqrt(w*h/3000)));for(let y=0;y<h;y+=stride)for(let x=0;x<w;x+=stride){const i=(y*w+x)*4;samples.push([rgb[i],rgb[i+1],rgb[i+2]])}if(!samples.length)return [];const k=Math.max(2,Math.min(32,Math.round(2+strength*30)));let centers=[];for(let i=0;i<k;i++)centers.push(samples[Math.floor(Math.random()*samples.length)].slice());for(let iter=0;iter<8;iter++){const sums=centers.map(()=>[0,0,0,0]);for(const c of samples){let best=0,bd=Infinity;for(let j=0;j<centers.length;j++){const dr=c[0]-centers[j][0],dg=c[1]-centers[j][1],db=c[2]-centers[j][2],d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;best=j}}sums[best][0]+=c[0];sums[best][1]+=c[1];sums[best][2]+=c[2];sums[best][3]++}centers=centers.map((c,j)=>sums[j][3]?[sums[j][0]/sums[j][3],sums[j][1]/sums[j][3],sums[j][2]/sums[j][3]]:c)}return centers}
function nearestPaletteColor(color,palette){if(!palette.length)return color;let best=palette[0],bd=Infinity;for(const p of palette){const dr=color[0]-p[0],dg=color[1]-p[1],db=color[2]-p[2],d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;best=p}}return best}
function embroideryStitches(rgb,w,h,stitchLength,stitchSpacing,stitchWidth,lightAngle,colorCompression){
const stitches=[],gray=blurBox(normalize01(grayscale(rgb,w,h)),w,h,3),minSpacing=Math.sqrt(w*h/MAX_STITCH_SEEDS),effectiveSpacing=Math.max(stitchSpacing,minSpacing),lightRad=(Number.isFinite(lightAngle)?lightAngle:315)*Math.PI/180,lightX=Math.cos(lightRad),lightY=Math.sin(lightRad),palette=colorCompression>0?buildPalette(rgb,w,h,colorCompression):[];
function colorAt(x,y){const i=(Math.max(0,Math.min(h-1,Math.round(y)))*w+Math.max(0,Math.min(w-1,Math.round(x))))*4;return [rgb[i],rgb[i+1],rgb[i+2]]}
function gradAt(x,y){const get=(xx,yy)=>gray[Math.max(0,Math.min(h-1,Math.round(yy)))*w+Math.max(0,Math.min(w-1,Math.round(xx)))];return{gx:-get(x-1,y-1)-2*get(x-1,y)-get(x-1,y+1)+get(x+1,y-1)+2*get(x+1,y)+get(x+1,y+1),gy:-get(x-1,y-1)-2*get(x,y-1)-get(x+1,y-1)+get(x-1,y+1)+2*get(x,y+1)+get(x+1,y+1)}}

function normalize01(g){return Float32Array.from(g,v=>v/255)}function invert01(g){return Float32Array.from(g,v=>1-v)}

function blurBox(input,w,h,radius){const r=Math.max(1,Math.round(radius)),tmp=new Float32Array(input.length),out=new Float32Array(input.length);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let d=-r;d<=r;d++){const xx=x+d;if(xx>=0&&xx<w){s+=input[y*w+xx];n++}}tmp[y*w+x]=s/n}for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let d=-r;d<=r;d++){const yy=y+d;if(yy>=0&&yy<h){s+=tmp[yy*w+x];n++}}out[y*w+x]=s/n}return out}

function sampleBilinear(g,w,h,x,y){x=Math.max(0,Math.min(w-1.001,x));y=Math.max(0,Math.min(h-1.001,y));const x0=Math.floor(x),y0=Math.floor(y),x1=Math.min(w-1,x0+1),y1=Math.min(h-1,y0+1),fx=x-x0,fy=y-y0;return g[y0*w+x0]*(1-fx)*(1-fy)+g[y0*w+x1]*fx*(1-fy)+g[y1*w+x0]*(1-fx)*fy+g[y1*w+x1]*fx*fy}
